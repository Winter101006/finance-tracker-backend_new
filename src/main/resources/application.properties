spring.application.name=finance-tracker
server.port=8080

# ===================== DATABASE (Neon PostgreSQL Cloud) =====================
spring.datasource.url=jdbc:postgresql://ep-autumn-surf-aonxd4iv-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_7xmXaQMTP5LS
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / HIBERNATE =====================
# "update": tự động tạo hoặc cập nhật bảng trên PostgreSQL, lưu trữ vĩnh viễn
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== H2 CONSOLE (Vô hiệu hóa vì đã dùng PostgreSQL) =====================
spring.h2.console.enabled=false

# ===================== THYMELEAF =====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===================== DỮ LIỆU MẪU =====================
# Tạo danh mục thu/chi mặc định khi bảng danh mục trên cloud còn trống
app.seed.default-categories=true
# Tạo giao dịch mẫu 6 tháng gần nhất
app.seed.sample-transactions=false

# ===================== CẤU HÌNH KHÁC =====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.format.date=yyyy-MM-dd