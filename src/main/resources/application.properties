spring.application.name=finance-tracker
server.port=8080

# ===================== DATABASE (H2 lưu file - dữ liệu vĩnh viễn) =====================
# Dữ liệu lưu tại ./data/financedb.mv.db (tính từ thư mục chạy ứng dụng).
# AUTO_SERVER=TRUE cho phép mở cùng lúc từ ứng dụng và công cụ bên ngoài (DBeaver, IntelliJ...).
spring.datasource.url=jdbc:h2:file:./data/financedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================== JPA / HIBERNATE =====================
# "update": tự tạo/cập nhật bảng, KHÔNG xóa dữ liệu khi khởi động lại.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== H2 CONSOLE =====================
# Truy cập: http://localhost:8080/h2-console  (JDBC URL giống spring.datasource.url)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================== THYMELEAF =====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===================== DỮ LIỆU MẪU =====================
# Tạo danh mục thu/chi mặc định khi bảng danh mục trống.
app.seed.default-categories=true
# Tạo giao dịch mẫu 6 tháng gần nhất (chỉ khi chưa có giao dịch nào) - hữu ích để xem demo biểu đồ.
app.seed.sample-transactions=false

# ===================== KHÁC =====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.format.date=yyyy-MM-dd
