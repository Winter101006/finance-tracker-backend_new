<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lỗi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="card mx-auto text-center" style="max-width: 520px;">
        <div class="card-body p-5">
            <div class="display-3 fw-bold text-primary" th:text="${status} ?: 'Lỗi'">500</div>
            <p class="lead mt-3"
               th:text="${status == 404} ? 'Không tìm thấy trang bạn yêu cầu' : 'Đã có lỗi xảy ra, vui lòng thử lại sau'">
                Đã có lỗi xảy ra
            </p>
            <p class="small text-muted" th:if="${error}" th:text="${error}">Error</p>
            <a th:href="@{/}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i>Về trang tổng quan</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
