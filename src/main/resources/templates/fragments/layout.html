<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- ============ HEAD ============ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Finance Tracker'">Finance Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- ============ NAVBAR ============ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-logo"><i class="bi bi-wallet2"></i></span>
            Finance Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/}">
                        <i class="bi bi-speedometer2 me-1"></i>Tổng quan
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'transactions'} ? 'active'"
                       th:href="@{/transactions}">
                        <i class="bi bi-arrow-left-right me-1"></i>Giao dịch
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'categories'} ? 'active'"
                       th:href="@{/categories}">
                        <i class="bi bi-tags me-1"></i>Danh mục
                    </a>
                </li>
            </ul>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-nav-action btn-nav-income" th:href="@{/transactions/new(type='INCOME')}">
                    <i class="bi bi-plus-lg"></i> Khoản thu
                </a>
                <a class="btn btn-sm btn-nav-action btn-nav-expense" th:href="@{/transactions/new(type='EXPENSE')}">
                    <i class="bi bi-dash-lg"></i> Khoản chi
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ============ FLASH MESSAGES ============ -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">OK</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
</div>

<!-- ============ FOOTER ============ -->
<footer th:fragment="footer" class="app-footer py-4 mt-auto">
    <div class="container text-center">
        <div class="footer-creator">
            <span class="footer-badge">
                <i class="bi bi-patch-check-fill text-sky me-1"></i>
                <span>Nhà sáng tạo: <strong class="creator-name">Phạm Ngọc Huân</strong></span>
            </span>
        </div>
    </div>
</footer>

<!-- ============ SCRIPTS ============ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
