# Cấu hình riêng cho test: dùng H2 in-memory để không ảnh hưởng dữ liệu thật trong ./data
spring.datasource.url=jdbc:h2:mem:financedb-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.seed.default-categories=true
app.seed.sample-transactions=false
